[package]
name = "agentwire"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Record, diff, and deterministic replay for coding-agent protocols (Codex App Server, ACP, MCP)"
license = "MIT"
repository = "https://github.com/tcballard/AgentWire"
readme = "README.md"
exclude = [".github/"]
keywords = ["codex", "acp", "mcp", "debugging", "replay"]
categories = ["command-line-utilities", "development-tools::debugging"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.2"
libc = "0.2"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.12"

[features]
test-support = []

[[bin]]
name = "agentwire-mock-server"
path = "tests/support/mock_app_server.rs"
required-features = ["test-support"]

[[bin]]
name = "agentwire-mock-acp-agent"
path = "tests/support/mock_acp_agent.rs"
required-features = ["test-support"]

[[bin]]
name = "agentwire-mock-mcp-server"
path = "tests/support/mock_mcp_server.rs"
required-features = ["test-support"]

[profile.release]
lto = true
codegen-units = 1
strip = true
