[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentwire"
version = "0.1.0"
description = "A transparent recorder, inspector, and deterministic replay server for Codex App Server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tom Ballard" }]
keywords = ["codex", "json-rpc", "debugging", "replay", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
agentwire = "agentwire.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentwire"]
